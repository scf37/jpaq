name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  difftest:
    # Compares the Java port with the C++ original: archives must be byte-identical.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -ntp -DskipTests install
      - name: Build C++ reference
        run: tools/difftest/build-ref.sh
      - name: Scenarios
        run: |
          for s in tools/difftest/scenarios/0[1-7]*.sh; do
            echo "### $s"
            $s | tee out.txt
            ! grep -v -E '^(OK|==|size|###)' out.txt
          done
      - name: Fuzz
        run: |
          for seed in 1 2 3 4 5 6 7 8; do
            python3 tools/difftest/fuzz.py $seed 6 | tee out.txt
            grep -q PASS out.txt
          done
